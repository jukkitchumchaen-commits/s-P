name: Stock Signal Bot

on:
  workflow_dispatch:
  schedule:
    # รันเฉพาะช่วงเวลาตลาดเปิดวันจันทร์-ศุกร์ (ทุก 2 ชม. ระหว่าง 13:00 - 21:00 UTC)
    - cron: "0 13-21/2 * * 1-5"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_bot.py

      # เซฟสถานะ alert_state.json กลับเข้า GitHub Repository
      - name: Save alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          git diff --cached --quiet || (git commit -m "Update stock alert state [skip ci]" && git pull --rebase origin main && git push)

      - name: Send success message
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🤖 <b>Stock Signal Bot</b>

          ✅ รันโค้ดสำเร็จแล้ว
          🕐 เวลา: $(date '+%Y-%m-%d %H:%M:%S UTC')
          📊 ตรวจสอบหุ้นเรียบร้อยแล้ว
          🚀 GitHub Actions ทำงานปกติ"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"

      - name: Send failure message
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🚨 <b>Stock Signal Bot</b>

          ❌ รันโค้ดไม่สำเร็จ
          🕐 เวลา: $(date '+%Y-%m-%d %H:%M:%S UTC')
          ⚠️ กรุณาตรวจสอบ GitHub Actions"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
